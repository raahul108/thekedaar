<!DOCTYPE html>
<html lang="hi" class="theme-amoled">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ठेकेDAAR - निर्माण व मजदूर प्रबंधन</title>
  <link rel="icon" type="image/png" href="./logo.png?v=27">
  <link rel="apple-touch-icon" href="./logo.png?v=27">
  <link rel="manifest" href="manifest.json?v=27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html.theme-amoled {
      color-scheme: dark;
      --bg: #000000;
      --surface: rgba(18, 18, 22, 0.86);
      --surface-2: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.09);
      --text: #fafafa;
      --muted: #8e8e93;
      --accent: #6366f1;
      --primary-bg: #ffffff;
      --primary-fg: #09090b;
      --nav-bg: rgba(16, 16, 20, 0.90);
      --cal-filter: invert(1) brightness(1.6);
    }
    html.theme-dark {
      color-scheme: dark;
      --bg: #090b10;
      --surface: rgba(17, 21, 32, 0.88);
      --surface-2: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #818cf8;
      --primary-bg: #f8fafc;
      --primary-fg: #0f172a;
      --nav-bg: rgba(15, 19, 29, 0.92);
      --cal-filter: invert(1) brightness(1.6);
    }
    html.theme-light {
      color-scheme: light;
      --bg: #f4f4f5;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-2: rgba(9, 9, 11, 0.04);
      --border: rgba(9, 9, 11, 0.10);
      --text: #09090b;
      --muted: #52525b;
      --accent: #4f46e5;
      --primary-bg: #09090b;
      --primary-fg: #ffffff;
      --nav-bg: rgba(255, 255, 255, 0.94);
      --cal-filter: invert(0);
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% -10%, rgba(99, 102, 241, 0.12), transparent 45%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: var(--cal-filter); cursor: pointer; }

    .surface {
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .surface-subtle {
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .btn-primary {
      background: var(--primary-bg);
      color: var(--primary-fg);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-primary:active { transform: scale(0.96); opacity: 0.9; }
    .btn-accent {
      background: rgba(99, 102, 241, 0.14);
      color: var(--accent);
      border: 1px solid rgba(99, 102, 241, 0.28);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-accent:active { transform: scale(0.96); }

    .ios-nav {
      background: var(--nav-bg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .nav-btn { color: var(--muted); transition: all 0.2s ease; }
    .nav-btn.active {
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      transform: scale(1.04);
    }

    .app-input {
      background: var(--surface-2) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      transition: border-color 0.2s ease;
    }
    .app-input:focus { border-color: var(--accent) !important; outline: none; }
    .app-input::placeholder { color: var(--muted) !important; opacity: 0.85; }

    .trade-card {
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: all 0.18s ease;
    }
    .trade-card.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.14);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-32 select-none no-scrollbar">

  <!-- OFFLINE BLOCKER -->
  <div id="offlineModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl hidden flex-col items-center justify-center p-6 text-center">
    <div class="w-14 h-14 rounded-2xl surface flex items-center justify-center mb-4 text-rose-500">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18.364 5.636a9 9 0 010 12.728M3 3l18 18"/></svg>
    </div>
    <h2 class="text-base font-bold" data-i18n="offlineTitle"></h2>
    <p class="text-xs opacity-60 max-w-xs mt-1" data-i18n="offlineDesc"></p>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 px-4 pt-3.5 pb-2.5 surface border-x-0 border-t-0">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button type="button" onclick="openProfileModal()" class="relative active:scale-95 transition-transform">
          <div id="userAvatarBadge" class="w-9 h-9 rounded-xl btn-primary font-black text-sm flex items-center justify-center">ठे</div>
          <span id="syncDot" class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-black"></span>
        </button>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-black tracking-tight">ठेकेDAAR</h1>
            <span id="activeNicknameBadge" class="text-[9px] px-1.5 py-0.5 rounded-md surface-subtle font-semibold opacity-80"></span>
          </div>
          <span id="syncStatus" class="text-[10px] opacity-60 font-medium block mt-0.5"></span>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button type="button" onclick="forceCloudPull()" class="w-9 h-9 rounded-xl surface-subtle flex items-center justify-center opacity-80 hover:opacity-100 active:scale-90" title="Sync">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button type="button" onclick="openMonthlyLedgerModal()" class="w-9 h-9 rounded-xl surface-subtle flex items-center justify-center opacity-80 hover:opacity-100 active:scale-90" title="Ledger">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <button type="button" onclick="openSettingsModal()" class="w-9 h-9 rounded-xl surface-subtle flex items-center justify-center opacity-80 hover:opacity-100 active:scale-90" title="Settings">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- SITE & MONTH BAR -->
  <div class="max-w-md mx-auto px-4 pt-3">
    <div class="surface rounded-2xl p-2 flex items-center justify-between gap-1.5">
      <div class="flex items-center gap-1.5 flex-1 min-w-0 pl-1">
        <svg class="w-4 h-4 opacity-60 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><circle cx="12" cy="11" r="3"/></svg>
        <select id="siteSelect" onchange="renderAll()" class="bg-transparent text-xs font-semibold focus:outline-none w-full truncate"></select>
      </div>
      <button type="button" onclick="addNewSite()" class="px-2.5 py-1.5 btn-accent font-semibold text-[11px] rounded-xl shrink-0" data-i18n="addSiteBtn"></button>
      <button type="button" id="deleteSiteBtn" onclick="deleteCurrentSite()" class="p-1.5 surface-subtle text-rose-500 rounded-xl shrink-0 active:scale-95">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <input type="hidden" id="monthSelect" value="2026-11" />
      <button type="button" onclick="openMonthPickerModal()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl surface-subtle shrink-0 active:scale-95">
        <span id="monthDisplayLabel" class="text-[11px] font-semibold"></span>
      </button>
    </div>
  </div>

  <!-- MAIN BODY -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- GRAPHICAL OVERVIEW CARD (DONUT CHART + METRICS) -->
    <div class="surface rounded-3xl p-4 flex items-center gap-4">
      <div class="relative w-20 h-20 shrink-0 flex items-center justify-center">
        <svg class="w-20 h-20 -rotate-90" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15.5" fill="none" stroke="currentColor" stroke-opacity="0.08" stroke-width="3.2"/>
          <circle id="ringBills" cx="18" cy="18" r="15.5" fill="none" stroke="#10b981" stroke-width="3.2" stroke-dasharray="0 100" stroke-linecap="round"/>
          <circle id="ringDue" cx="18" cy="18" r="15.5" fill="none" stroke="#f43f5e" stroke-width="3.2" stroke-dasharray="0 100" stroke-linecap="round"/>
          <circle id="ringExp" cx="18" cy="18" r="15.5" fill="none" stroke="#6366f1" stroke-width="3.2" stroke-dasharray="0 100" stroke-linecap="round"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
          <span id="ringWorkerCount" class="text-sm font-black leading-none">0</span>
          <span class="text-[8px] uppercase opacity-55 mt-0.5">Staff</span>
        </div>
      </div>

      <div class="flex-1 grid grid-cols-1 gap-1.5 text-xs">
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1.5 opacity-75"><span class="w-2 h-2 rounded-full bg-rose-500"></span><span data-i18n="labourDue"></span></span>
          <b id="summaryLabourDue" class="font-bold">₹0</b>
        </div>
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1.5 opacity-75"><span class="w-2 h-2 rounded-full bg-indigo-500"></span><span data-i18n="expenses"></span></span>
          <b id="summaryExpensesTotal" class="font-bold">₹0</b>
        </div>
        <div onclick="navigateTo('viewBills')" class="flex items-center justify-between cursor-pointer">
          <span class="flex items-center gap-1.5 opacity-75"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span data-i18n="bills"></span></span>
          <b id="summaryBillsTotal" class="font-bold text-emerald-500">₹0</b>
        </div>
      </div>
    </div>

    <!-- MINIMAL AUDIO SUMMARY STRIP -->
    <div class="surface rounded-2xl px-4 py-3 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h3 class="text-xs font-bold truncate" data-i18n="audioSummaryTitle"></h3>
        <p class="text-[10px] opacity-60 truncate" data-i18n="audioSummarySub"></p>
      </div>
      <button type="button" onclick="playVoiceSummary()" class="px-3.5 py-2 rounded-xl btn-primary font-semibold text-xs inline-flex items-center gap-1.5 shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span data-i18n="listenBtn"></span>
      </button>
    </div>

    <!-- VIEW 1: HOME -->
    <section id="viewHome" class="space-y-3">
      <div class="flex items-center justify-between px-0.5">
        <h2 class="text-[11px] font-semibold uppercase tracking-wider opacity-60" data-i18n="liveSnapshot"></h2>
        <button type="button" onclick="navigateTo('viewLabours')" class="text-[11px] font-semibold text-indigo-400" data-i18n="viewAllBtn"></button>
      </div>
      <div id="homeRecentLabour" class="space-y-2.5"></div>
    </section>

    <!-- VIEW 2: LABOURS -->
    <section id="viewLabours" class="space-y-3 hidden">
      <div class="flex items-center justify-between gap-1">
        <h2 class="text-sm font-bold" data-i18n="tabLabour"></h2>
        <div class="flex items-center gap-1.5">
          <button type="button" onclick="openHajriBookModal()" class="px-2.5 py-1.5 surface-subtle font-semibold text-xs rounded-xl active:scale-95" data-i18n="hajriBookBtn"></button>
          <button type="button" onclick="openCarrySelectModal()" class="px-2.5 py-1.5 surface-subtle font-semibold text-xs rounded-xl active:scale-95 flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
            <span data-i18n="carryBtn"></span>
          </button>
          <button type="button" onclick="openFormModal('labour')" class="px-3 py-1.5 btn-primary font-semibold text-xs rounded-xl" data-i18n="addWorkerBtn"></button>
        </div>
      </div>

      <div class="surface p-2.5 rounded-2xl space-y-2">
        <div class="flex items-center gap-1.5">
          <input type="text" id="labourSearchInput" oninput="renderAll()" data-i18n-placeholder="searchWorkerPh" class="app-input flex-1 rounded-xl px-3 py-1.5 text-xs font-medium" />
          <button type="button" onclick="startVoiceInputForField('labourSearchInput')" class="p-2 btn-accent rounded-xl active:scale-90">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <button type="button" onclick="setLabourCategoryFilter('ALL')" data-cat="ALL" class="cat-pill px-2.5 py-1 rounded-lg text-[11px] font-semibold btn-primary shrink-0" data-i18n="filterAll"></button>
          <button type="button" onclick="setLabourCategoryFilter('Mason')" data-cat="Mason" class="cat-pill px-2.5 py-1 rounded-lg text-[11px] font-medium opacity-70 shrink-0" data-i18n="tradeMason"></button>
          <button type="button" onclick="setLabourCategoryFilter('Helper')" data-cat="Helper" class="cat-pill px-2.5 py-1 rounded-lg text-[11px] font-medium opacity-70 shrink-0" data-i18n="tradeHelper"></button>
          <button type="button" onclick="setLabourCategoryFilter('Plumber')" data-cat="Plumber" class="cat-pill px-2.5 py-1 rounded-lg text-[11px] font-medium opacity-70 shrink-0" data-i18n="tradePlumber"></button>
          <button type="button" onclick="setLabourCategoryFilter('Carpenter')" data-cat="Carpenter" class="cat-pill px-2.5 py-1 rounded-lg text-[11px] font-medium opacity-70 shrink-0" data-i18n="tradeCarpenter"></button>
          <button type="button" onclick="setLabourCategoryFilter('Electrician')" data-cat="Electrician" class="cat-pill px-2.5 py-1 rounded-lg text-[11px] font-medium opacity-70 shrink-0" data-i18n="tradeElectrician"></button>
        </div>
      </div>
      <div id="labourList" class="space-y-3"></div>
    </section>

    <!-- VIEW 3: EXPENSES -->
    <section id="viewExpenses" class="space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold" data-i18n="tabExpenses"></h2>
        <button type="button" onclick="openFormModal('expense')" class="px-3 py-1.5 btn-primary font-semibold text-xs rounded-xl" data-i18n="addExpenseBtn"></button>
      </div>
      <div id="expenseList" class="space-y-2.5"></div>
    </section>

    <!-- VIEW 4: BILLS -->
    <section id="viewBills" class="space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold" data-i18n="tabBills"></h2>
        <button type="button" onclick="openFormModal('bill')" class="px-3 py-1.5 btn-primary font-semibold text-xs rounded-xl" data-i18n="addBillBtn"></button>
      </div>
      <div id="billList" class="space-y-2.5"></div>
    </section>
  </main>

  <!-- FLOATING NAVIGATION -->
  <div class="fixed bottom-4 inset-x-0 z-40 flex justify-center pointer-events-none px-3">
    <nav class="ios-nav pointer-events-auto rounded-full py-1.5 px-3 flex items-center justify-around gap-1 w-full max-w-[340px]">
      <button type="button" onclick="navigateTo('viewHome')" id="nav-viewHome" class="nav-btn active w-12 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.1l9 8.1c.4.3.6.8.6 1.3v8.5c0 1.1-.9 2-2 2h-4.5c-.8 0-1.5-.7-1.5-1.5V15c0-.6-.4-1-1-1s-1 .4-1 1v5.5c0 .8-.7 1.5-1.5 1.5H5.4c-1.1 0-2-.9-2-2v-8.5c0-.5.2-1 .6-1.3l9-8.1z"/></svg></button>
      <button type="button" onclick="navigateTo('viewLabours')" id="nav-viewLabours" class="nav-btn w-12 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
      <button type="button" onclick="openFormModal('labour')" class="w-11 h-11 flex items-center justify-center active:scale-90"><div class="w-8 h-8 rounded-xl btn-primary flex items-center justify-center font-black text-lg leading-none">+</div></button>
      <button type="button" onclick="navigateTo('viewExpenses')" id="nav-viewExpenses" class="nav-btn w-12 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></button>
      <button type="button" onclick="navigateTo('viewBills')" id="nav-viewBills" class="nav-btn w-12 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></button>
    </nav>
  </div>

  <!-- MODALS -->
  <div id="monthPickerModal" class="fixed inset-0 bg-black/75 backdrop-blur-xl hidden items-center justify-center p-4 z-50">
    <div class="surface rounded-3xl max-w-xs w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-current/10 pb-2">
        <h3 class="font-bold text-sm" data-i18n="selectMonthYear"></h3>
        <button type="button" onclick="closeModal('monthPickerModal')" class="text-sm opacity-60">✕</button>
      </div>
      <div class="flex items-center justify-between surface-subtle p-2 rounded-2xl">
        <button type="button" onclick="changePickerYear(-1)" class="w-8 h-8 rounded-xl surface font-bold">‹</button>
        <span id="pickerYearDisplay" class="text-sm font-bold">2026</span>
        <button type="button" onclick="changePickerYear(1)" class="w-8 h-8 rounded-xl surface font-bold">›</button>
      </div>
      <div id="pickerMonthsGrid" class="grid grid-cols-3 gap-2"></div>
      <button type="button" onclick="selectCurrentMonthNow()" class="w-full py-2.5 rounded-xl btn-primary text-xs font-semibold" data-i18n="currentMonthBtn"></button>
    </div>
  </div>

  <div id="profileModal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="surface rounded-t-3xl sm:rounded-3xl max-w-sm w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">

    window.saveBill = async (e) => {
      e.preventDefault();
      state.bills.unshift({ id: Date.now().toString(), site: byId('siteSelect').value, month: byId('monthSelect').value, title: byId('bTitle').value.trim(), amount: Number(byId('bAmount').value)||0, billDate: byId('bDate').value || isoToday, status: 'Pending', attachment: await readFile(byId('bFile').files[0]), addedBy: getStamp() });
      e.target.reset(); closeModal('formModal'); persist(); navigateTo('viewBills');
    };
    window.deleteRecord = (type, id) => { if (isMaster()) openConfirm(t('deleteBtn'), '', () => { state[type] = state[type].filter(x => x.id !== id); persist(); }); };
    window.updateAtt = (id, kind) => { const l = state.labours.find(x => x.id === id); if (!l) return; if (kind==='+P') l.presentDays++; if (kind==='-P' && l.presentDays>0) l.presentDays--; if (kind==='+H') l.halfDays++; l.lastUpdatedBy = getStamp(); persist(); };
    window.editRate = (id) => { const l = state.labours.find(x => x.id === id); if (l && isMaster()) openCustomDialog({ title: t('dailyWageLabel'), inputType: 'number', defaultValue: l.dailyRate, onConfirm: v => { if (v) { l.dailyRate = Number(v); persist(); } } }); };
    window.openAdv = (id) => {
      const l = state.labours.find(x => x.id === id); if (!l) return;
      byId('advLabourId').value = id; byId('advWorkerName').innerText = `${l.name} (${fmtINR(l.advance)})`;
      byId('advHistoryList').innerHTML = (l.advanceLog||[]).map(h => `<div class="flex justify-between py-1 border-b border-current/10"><span>${fmtINR(h.amount)}</span><span class="opacity-60">${h.date}</span></div>`).join('');
      openModal('advanceModal');
    };
    window.submitExtraAdvance = (e) => {
      e.preventDefault();
      const l = state.labours.find(x => x.id === byId('advLabourId').value), amt = Number(byId('advAmount').value)||0;
      if (l && amt > 0) { l.advance += amt; (l.advanceLog = l.advanceLog||[]).unshift({ amount: amt, date: byId('advDate').value||isoToday }); l.lastUpdatedBy = getStamp(); closeModal('advanceModal'); persist(); }
    };
    window.settlePay = (id) => {
      const l = state.labours.find(x => x.id === id); if (!l || !isMaster()) return;
      const net = Math.round(l.dailyRate * (l.presentDays + l.halfDays * 0.5)) - l.advance;
      if (net > 0) openConfirm(t('settleLbl'), `${l.name}: ${fmtINR(net)}`, () => { l.advance += net; (l.advanceLog = l.advanceLog||[]).unshift({ amount: net, date: isoToday }); persist(); });
    };
    window.waSlip = (id) => {
      const l = state.labours.find(x => x.id === id); if (!l) return;
      const net = Math.round(l.dailyRate * (l.presentDays + l.halfDays * 0.5)) - l.advance;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(`*ठेकेDAAR*\n${l.name}\n${t('presentLbl')}: ${l.presentDays}P, ${l.halfDays}H\n${t('netDueLbl')}: ${fmtINR(net)}`)}`, '_blank');
    };

    window.openCarrySelectModal = () => {
      const site = byId('siteSelect').value, curM = byId('monthSelect').value;
      let [y, m] = curM.split('-').map(Number); m--; if (m < 1) { m = 12; y--; }
      const prevM = `${y}-${String(m).padStart(2,'0')}`;
      const curNames = new Set(state.labours.filter(l => l.site===site && l.month===curM).map(l => l.name.toLowerCase()));
      const cands = state.labours.filter(l => l.site===site && l.month===prevM && !curNames.has(l.name.toLowerCase()));
      window._carry = cands;
      byId('carryWorkersList').innerHTML = cands.length ? cands.map((w, i) => `<label class="flex items-center gap-2 p-2.5 rounded-xl surface-subtle text-xs"><input type="checkbox" value="${i}" class="carry-cb" checked/><b>${w.name}</b> (${fmtINR(w.dailyRate)})</label>`).join('') : `<div class="text-center py-6 text-xs opacity-60">${t('noWorkers')}</div>`;
      openModal('carryModal');
    };
    window.executeCarryForwardSelected = () => {
      const curM = byId('monthSelect').value;
      document.querySelectorAll('.carry-cb:checked').forEach(cb => {
        const w = (window._carry||[])[cb.value];
        if (w) state.labours.unshift({ ...w, id: Date.now().toString()+Math.random().toString().slice(2,5), month: curM, advance: 0, advanceLog: [], presentDays: 0, halfDays: 0, lastUpdatedBy: getStamp() });
      });
      closeModal('carryModal'); persist();
    };

    window.openHajriBookModal = () => { renderDailyHajriSheet(); openModal('hajriBookModal'); };
    window.shiftHajriDate = (d) => { const i = byId('hajriDateInput'); const dt = new Date(i.value||isoToday); dt.setDate(dt.getDate()+d); i.value = dt.toISOString().split('T')[0]; renderDailyHajriSheet(); };
    window.renderDailyHajriSheet = () => {
      const dt = byId('hajriDateInput').value, site = byId('siteSelect').value, m = dt.slice(0,7);
      const ws = state.labours.filter(l => l.site===site && l.month===m);
      const rec = (state.dailyHajriRecords[dt] = state.dailyHajriRecords[dt]||{});
      byId('hajriWorkersContainer').innerHTML = ws.map(w => `<div class="flex items-center justify-between p-2.5 rounded-xl surface-subtle text-xs"><b>${w.name}</b><div class="flex gap-1">${['P','H','A'].map(s => `<button type="button" onclick="setHajri('${dt}','${w.id}','${s}')" class="w-8 h-8 rounded-lg font-bold ${rec[w.id]===s ? (s==='P'?'bg-emerald-500 text-black':s==='H'?'bg-indigo-500 text-white':'bg-rose-500 text-white') : 'surface'}">${s}</button>`).join('')}</div></div>`).join('');
    };
    window.setHajri = (dt, id, s) => {
      (state.dailyHajriRecords[dt] = state.dailyHajriRecords[dt]||{})[id] = s;
      const m = dt.slice(0,7), w = state.labours.find(x => x.id === id);
      if (w) { let p=0, h=0; Object.keys(state.dailyHajriRecords).forEach(k => { if (k.startsWith(m)) { if (state.dailyHajriRecords[k][id]==='P') p++; if (state.dailyHajriRecords[k][id]==='H') h++; } }); w.presentDays = p; w.halfDays = h; w.lastUpdatedBy = getStamp(); }
      persist(); renderDailyHajriSheet();
    };
    window.markAllWorkersToday = (s) => { const dt = byId('hajriDateInput').value, site = byId('siteSelect').value; state.labours.filter(l => l.site===site && l.month===dt.slice(0,7)).forEach(w => setHajri(dt, w.id, s)); };
    window.openHist = (id) => {
      const l = state.labours.find(x => x.id === id); if (!l) return;
      byId('labourHistoryTitle').innerText = l.name;
      const rows = Object.keys(state.dailyHajriRecords).sort().filter(k => k.startsWith(l.month) && state.dailyHajriRecords[k][id]).map(k => `<div class="flex justify-between p-2 rounded-xl surface-subtle"><span>${k}</span><b>${state.dailyHajriRecords[k][id]}</b></div>`).join('');
      byId('labourHistoryContent').innerHTML = rows || `<div class="text-center py-4 opacity-60">${l.presentDays}P / ${l.halfDays}H</div>`;
      openModal('labourHistoryModal');
    };

    window.openMonthlyLedgerModal = () => {
      const site = byId('siteSelect').value, m = byId('monthSelect').value;
      const ws = state.labours.filter(l => l.site===site && l.month===m), ex = state.expenses.filter(e => e.site===site && e.month===m), bs = state.bills.filter(b => b.site===site && b.month===m);
      const wages = ws.reduce((a, w) => a + Math.round(w.dailyRate*(w.presentDays+w.halfDays*0.5)), 0);
      const expT = ex.reduce((a, e) => a + e.amount, 0), billT = bs.reduce((a, b) => a + b.amount, 0), profit = billT - (wages + expT);
      byId('monthlyLedgerModalBody').innerHTML = `
        <div class="p-3.5 rounded-2xl btn-accent flex justify-between items-center text-xs"><span class="font-semibold">${t('profitLbl')}</span><b class="text-sm">${fmtINR(profit)}</b></div>
        ${bs.map(b => `<div class="p-3 rounded-2xl surface-subtle text-xs space-y-2"><div class="flex justify-between"><b>${b.title}</b><b class="text-emerald-500">${fmtINR(b.amount)}</b></div>${b.attachment?.dataUrl?.startsWith('data:image') ? `<img src="${b.attachment.dataUrl}" class="w-full max-h-40 object-cover rounded-xl"/>` : ''}</div>`).join('')}`;
      openModal('monthlyLedgerModal');
    };

    window.playVoiceSummary = () => {
      const lang = window.currentLang || 'hi', s = byId('siteSelect').value, m = byId('monthSelect').value;
      const ws = state.labours.filter(l => l.site===s && l.month===m);
      const wages = ws.reduce((a, w) => a + Math.round(w.dailyRate*(w.presentDays+w.halfDays*0.5)), 0);
      const expNum = state.expenses.filter(e => e.site===s && e.month===m).reduce((a, b) => a + b.amount, 0);
      const billNum = state.bills.filter(b => b.site===s && b.month===m).reduce((a, b) => a + b.amount, 0);
      const msg = (summaryTemplates[lang] || summaryTemplates.hi)({ s, mName: fmtMonth(m), count: ws.length, due: byId('summaryLabourDue').innerText, exp: byId('summaryExpensesTotal').innerText, bill: byId('summaryBillsTotal').innerText, profit: fmtINR(billNum-(wages+expNum)) });
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(msg), loc = speechLocaleMap[lang] || 'hi-IN';
          u.lang = loc;
          const vs = window.speechSynthesis.getVoices() || [];
          const mv = vs.find(v => v.lang.toLowerCase() === loc.toLowerCase()) || vs.find(v => v.lang.toLowerCase().startsWith(loc.split('-')[0])) || vs.find(v => v.lang.toLowerCase().startsWith('hi'));
          if (mv) { u.voice = mv; u.lang = mv.lang; }
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    };

    window.renderAll = () => {
      const sel = byId('siteSelect');
      if (!state.sites.length) state.sites = ['Site A'];
      const curS = sel.value && state.sites.includes(sel.value) ? sel.value : state.sites[0];
      sel.innerHTML = state.sites.map(s => `<option value="${s}" ${s===curS?'selected':''}>${s}</option>`).join('');
      const site = sel.value, m = byId('monthSelect').value, master = isMaster();
      byId('monthDisplayLabel').innerText = fmtMonth(m);
      byId('activeNicknameBadge').innerText = getActiveAcc().displayNickname;
      byId('deleteSiteBtn').classList.toggle('hidden', !master);
      byId('loggedInEmailDisplay').innerText = currentUser?.email || t('notLoggedLbl');
      byId('profileLogoutBtn').classList.toggle('hidden', !currentUser);
      byId('syncStatus').innerText = currentUser ? `${t('cloudLbl')} • ${currentUser.email.split('@')[0]}` : t('onlineLbl');

      const allW = state.labours.filter(l => l.site===site && l.month===m);
      const q = (byId('labourSearchInput')?.value || '').trim().toLowerCase();
      const visW = allW.filter(l => (!q || l.name.toLowerCase().includes(q) || (l.phone||'').includes(q)) && (activeCategoryFilter==='ALL' || l.category.toLowerCase().includes(activeCategoryFilter.toLowerCase())));

      const dueT = allW.reduce((a, w) => a + Math.round(w.dailyRate*(w.presentDays+w.halfDays*0.5)) - w.advance, 0);
      const ex = state.expenses.filter(e => e.site===site && e.month===m), expT = ex.reduce((a, b) => a + b.amount, 0);
      const bs = state.bills.filter(b => b.site===site && b.month===m), billT = bs.reduce((a, b) => a + b.amount, 0);

      byId('summaryLabourDue').innerText = fmtINR(dueT);
      byId('summaryExpensesTotal').innerText = fmtINR(expT);
      byId('summaryBillsTotal').innerText = fmtINR(billT);
      byId('ringWorkerCount').innerText = allW.length;

      // Update SVG Donut Chart
      const total = Math.max(1, Math.abs(dueT) + expT + billT);
      const pBill = (billT / total) * 97.4, pDue = (Math.abs(dueT) / total) * 97.4, pExp = (expT / total) * 97.4;
      byId('ringBills').setAttribute('stroke-dasharray', `${pBill} 100`);
      byId('ringDue').setAttribute('stroke-dasharray', `${pDue} 100`);
      byId('ringDue').setAttribute('stroke-dashoffset', `${-pBill}`);
      byId('ringExp').setAttribute('stroke-dasharray', `${pExp} 100`);
      byId('ringExp').setAttribute('stroke-dashoffset', `${-(pBill + pDue)}`);

      byId('labourList').innerHTML = visW.length ? visW.map(l => {
        const eff = l.presentDays + l.halfDays * 0.5, net = Math.round(l.dailyRate * eff) - l.advance, pct = Math.min(100, Math.round((eff/30)*100));
        return `
          <div class="surface p-4 rounded-3xl space-y-2.5">
            <div class="flex justify-between items-start gap-2">
              <div class="flex items-start gap-2.5 min-w-0">
                <div class="w-9 h-9 rounded-xl btn-accent flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">${(l.name||'W')[0].toUpperCase()}</div>
                <div class="min-w-0">
                  <button type="button" onclick="openHist('${l.id}')" class="font-bold text-sm truncate block text-left">${l.name}</button>
                  <div class="text-[11px] opacity-60">${l.category} ${l.phone ? `• <a href="tel:${l.phone}" class="underline">${l.phone}</a>` : ''}</div>
                  <div class="text-[11px] mt-1 flex items-center gap-1.5 flex-wrap">
                    <span>${t('rateLbl')}: <b>${fmtINR(l.dailyRate)}</b></span>
                    ${master ? `<button type="button" onclick="editRate('${l.id}')" class="text-[10px] px-1.5 py-0.5 rounded btn-accent font-semibold">${t('editLbl')}</button>` : ''}
                    <span>• ${t('advLbl')}: <b class="text-rose-400">${fmtINR(l.advance)}</b></span>
                    <button type="button" onclick="openAdv('${l.id}')" class="text-[10px] px-1.5 py-0.5 rounded btn-accent font-semibold">+ ${t('advLbl')}</button>
                  </div>
                </div>
              </div>
              <div class="text-right shrink-0">
                <span class="text-[10px] uppercase opacity-55 block">${t('netDueLbl')}</span>
                <span class="text-sm font-bold ${net>=0?'text-emerald-500':'text-rose-500'}">${fmtINR(net)}</span>
                ${master ? `<button type="button" onclick="deleteRecord('labours','${l.id}')" class="block ml-auto text-[10px] text-rose-500/80 font-semibold mt-1">${t('deleteBtn')}</button>` : ''}
              </div>
            </div>
            <div class="w-full h-1.5 rounded-full bg-current/10 overflow-hidden"><div class="h-full bg-indigo-500 transition-all" style="width:${pct}%"></div></div>
            <div class="surface-subtle p-2 rounded-2xl flex items-center justify-between text-xs">
              <span onclick="openHist('${l.id}')" class="cursor-pointer opacity-85">${t('presentLbl')}: <b class="text-emerald-500">${l.presentDays}P</b> • ${t('halfLbl')}: <b class="text-indigo-400">${l.halfDays}H</b></span>
              <div class="flex gap-1">
                <button type="button" onclick="updateAtt('${l.id}','-P')" class="w-7 h-7 rounded-lg surface font-semibold">-P</button>
                <button type="button" onclick="updateAtt('${l.id}','+P')" class="w-7 h-7 rounded-lg btn-primary font-semibold">+P</button>
                <button type="button" onclick="updateAtt('${l.id}','+H')" class="px-2 h-7 rounded-lg btn-accent font-semibold">+H</button>
              </div>
            </div>
            <div class="flex items-center justify-between text-[11px] gap-2">
              <span class="opacity-50 truncate">${l.lastUpdatedBy || ''}</span>
              <div class="flex gap-1.5 shrink-0">
                ${master && net > 0 ? `<button type="button" onclick="settlePay('${l.id}')" class="px-2.5 py-1 rounded-xl btn-accent font-semibold">${t('settleLbl')}</button>` : ''}
                <button type="button" onclick="waSlip('${l.id}')" class="px-2.5 py-1 rounded-xl btn-primary font-semibold">${t('slipLbl')}</button>
              </div>
            </div>
          </div>`;
      }).join('') : `<div class="surface rounded-2xl p-6 text-center text-xs opacity-60">${t('noWorkers')}</div>`;

      byId('homeRecentLabour').innerHTML = allW.length ? allW.slice(0,4).map(l => {
        const net = Math.round(l.dailyRate*(l.presentDays+l.halfDays*0.5)) - l.advance;
        return `<div onclick="openHist('${l.id}')" class="surface p-3.5 rounded-2xl flex justify-between items-center text-xs cursor-pointer active:scale-98"><div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-xl btn-accent flex items-center justify-center font-bold">${(l.name||'W')[0].toUpperCase()}</div><div><b>${l.name}</b><div class="text-[10px] opacity-60">${l.category} • ${l.presentDays}P, ${l.halfDays}H</div></div></div><b class="text-sm ${net>=0?'text-emerald-500':'text-rose-500'}">${fmtINR(net)}</b></div>`;
      }).join('') : `<div class="surface rounded-2xl p-6 text-center text-xs opacity-60">${t('noWorkers')}</div>`;

      byId('expenseList').innerHTML = ex.length ? ex.map(e => `<div class="surface p-3.5 rounded-2xl flex justify-between items-center text-xs"><div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-xl btn-accent flex items-center justify-center shrink-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><div><b>${e.title}</b><div class="text-[10px] opacity-60">${e.spentFor||''} ${e.addedBy||''}</div></div></div><div class="text-right"><b class="block">${fmtINR(e.amount)}</b>${master?`<button type="button" onclick="deleteRecord('expenses','${e.id}')" class="text-[10px] text-rose-500/80 font-semibold">${t('deleteBtn')}</button>`:''}</div></div>`).join('') : `<div class="surface rounded-2xl p-6 text-center text-xs opacity-60">${t('noExpenses')}</div>`;

      byId('billList').innerHTML = bs.length ? bs.map(b => `<div class="surface p-3.5 rounded-2xl flex justify-between items-center text-xs"><div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-xl btn-accent flex items-center justify-center shrink-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div><b>${b.title}</b><div class="text-[10px] opacity-60">${b.billDate||''}</div></div></div><div class="text-right"><b class="block text-emerald-500">${fmtINR(b.amount)}</b>${master?`<button type="button" onclick="deleteRecord('bills','${b.id}')" class="text-[10px] text-rose-500/80 font-semibold">${t('deleteBtn')}</button>`:''}</div></div>`).join('') : `<div class="surface rounded-2xl p-6 text-center text-xs opacity-60">${t('noBills')}</div>`;
    };

    window.connectCloud = async (reg) => {
      const e = byId('authEmail').value.trim(), p = byId('authPass').value.trim();
      try { if (reg) await createUserWithEmailAndPassword(auth, e, p); else await signInWithEmailAndPassword(auth, e, p); closeModal('authModal'); } catch (err) { alert(err.message); }
    };
    window.logoutAccount = async () => {
      if (unsubSnap) { unsubSnap(); unsubSnap = null; }
      currentUser = null; applyFreshState(null); clearUserLocalCaches(); closeModal('profileModal'); renderAll();
      try { await signOut(auth); } catch (e) {}
    };

    onAuthStateChanged(auth, (user) => {
      if (unsubSnap) { unsubSnap(); unsubSnap = null; }
      currentUser = user; applyFreshState(null);
      if (user) {
        const key = getStoreKey();
        try { const saved = localStorage.getItem(key); if (saved) applyFreshState(JSON.parse(saved)); } catch (e) {}
        unsubSnap = onSnapshot(doc(db, "users", user.uid), (snap) => {
          if (snap.exists()) { applyFreshState(snap.data()); try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} renderAll(); }
          else persist();
        }, () => {});
      } else { clearUserLocalCaches(); }
      renderAll();
    });

    checkOnline();
    changeLanguage(window.currentLang);
  </script>
</body>
</html>
