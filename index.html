<!DOCTYPE html>
<html lang="hi" class="theme-amoled">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ठेकेDAAR - निर्माण व मजदूर प्रबंधन</title>
  <link rel="icon" type="image/png" href="./logo.png?v=20">
  <link rel="apple-touch-icon" href="./logo.png?v=20">
  <link rel="manifest" href="manifest.json?v=20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html.theme-amoled {
      color-scheme: dark; --bg-main: #000000; --card-bg: rgba(18, 20, 26, 0.85);
      --card-border: rgba(255, 255, 255, 0.14); --text-main: #ffffff; --text-sub: #a1a1aa;
      --nav-bg: rgba(20, 20, 24, 0.92); --nav-active: rgba(255, 255, 255, 0.16);
      --input-bg: rgba(255, 255, 255, 0.10); --input-border: rgba(255, 255, 255, 0.24);
      --cal-filter: invert(1) brightness(1.8);
    }
    html.theme-dark {
      color-scheme: dark; --bg-main: #0b111e; --card-bg: rgba(22, 32, 50, 0.88);
      --card-border: rgba(255, 255, 255, 0.16); --text-main: #f8fafc; --text-sub: #cbd5e1;
      --nav-bg: rgba(18, 26, 42, 0.94); --nav-active: rgba(255, 255, 255, 0.16);
      --input-bg: rgba(255, 255, 255, 0.09); --input-border: rgba(255, 255, 255, 0.22);
      --cal-filter: invert(1) brightness(1.8);
    }
    html.theme-light {
      color-scheme: light; --bg-main: #f1f5f9; --card-bg: #ffffff;
      --card-border: #cbd5e1; --text-main: #09090b; --text-sub: #475569;
      --nav-bg: rgba(255, 255, 255, 0.96); --nav-active: #e2e8f0;
      --input-bg: #f8fafc; --input-border: #94a3b8;
      --cal-filter: invert(0);
    }
    body {
      background: var(--bg-main); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: var(--cal-filter); cursor: pointer; }
    .ios-glass {
      background: var(--card-bg); backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
    }
    .ios-nav {
      background: var(--nav-bg); backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--card-border); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
    }
    .nav-btn { color: #94a3b8; transition: all 0.2s ease; }
    .nav-btn.active { color: var(--text-main); background: var(--nav-active); transform: scale(1.05); }
    .app-input { background: var(--input-bg) !important; color: var(--text-main) !important; border: 1.5px solid var(--input-border) !important; }
    .app-input::placeholder { color: var(--text-sub) !important; opacity: 0.85; }
    .ai-orb {
      background: radial-gradient(circle at 25% 25%, #3b82f6 0%, #8b5cf6 35%, #ec4899 68%, #f97316 100%);
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.45);
      border: 2.5px solid rgba(255, 255, 255, 0.85);
    }
    .trade-card { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); border: 1.5px solid var(--card-border); }
    .trade-card.active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(245, 158, 11, 0.08));
      border-color: #f59e0b; color: #f59e0b; transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.22);
    }
    .card-hover { transition: transform 0.2s ease, border-color 0.2s ease; }
    .card-hover:active { transform: scale(0.985); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-32 select-none no-scrollbar">

  <!-- OFFLINE BLOCKER -->
  <div id="offlineModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl hidden flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 rounded-3xl bg-rose-500/20 text-rose-500 flex items-center justify-center mb-4 animate-bounce">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18.364 5.636a9 9 0 010 12.728M3 3l18 18"/></svg>
    </div>
    <h2 class="text-lg font-black text-white" data-i18n="offlineTitle"></h2>
    <p class="text-xs text-zinc-400 max-w-xs mt-1" data-i18n="offlineDesc"></p>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 px-4 pt-3.5 pb-2.5 ios-glass border-x-0 border-t-0">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="openProfileModal()" class="relative active:scale-95 transition-transform">
          <div id="userAvatarBadge" class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 text-zinc-950 font-black flex items-center justify-center shadow-lg overflow-hidden">ठे</div>
          <span id="syncDot" class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-black"></span>
        </button>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-black tracking-tight leading-none">ठेकेDAAR</h1>
            <span id="activeNicknameBadge" class="text-[9px] px-1.5 py-0.5 rounded-full bg-amber-500/15 text-amber-500 font-bold border border-amber-500/30"></span>
          </div>
          <span id="syncStatus" class="text-[10px] text-emerald-500 font-bold block mt-0.5"></span>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="forceCloudPull()" class="w-9 h-9 rounded-xl ios-glass flex items-center justify-center text-emerald-500 active:scale-90" title="Sync">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button onclick="openMonthlyLedgerModal()" class="w-9 h-9 rounded-xl ios-glass flex items-center justify-center text-amber-500 active:scale-90" title="Ledger">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <button onclick="openSettingsModal()" class="w-9 h-9 rounded-xl ios-glass flex items-center justify-center active:scale-90" title="Settings">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- SITE & MONTH BAR -->
  <div class="max-w-md mx-auto px-4 pt-3">
    <div class="ios-glass rounded-2xl p-2 flex items-center justify-between gap-1.5">
      <div class="flex items-center gap-1.5 flex-1 min-w-0">
        <svg class="w-4 h-4 text-amber-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><circle cx="12" cy="11" r="3"/></svg>
        <select id="siteSelect" onchange="renderAll()" class="bg-transparent text-xs font-bold focus:outline-none w-full truncate"></select>
      </div>
      <button onclick="addNewSite()" class="px-2 py-1 bg-amber-500/15 text-amber-500 font-bold text-[11px] rounded-xl shrink-0 active:scale-95" data-i18n="addSiteBtn"></button>
      <button id="deleteSiteBtn" onclick="deleteCurrentSite()" class="p-1.5 bg-rose-500/15 text-rose-500 rounded-xl shrink-0 active:scale-95">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <input type="hidden" id="monthSelect" value="2026-11" />
      <button onclick="openMonthPickerModal()" class="flex items-center gap-1 px-2 py-1 rounded-xl bg-amber-500/10 border border-amber-500/30 shrink-0 active:scale-95">
        <span id="monthDisplayLabel" class="text-[11px] font-black"></span>
      </button>
    </div>
  </div>

  <!-- MAIN BODY -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="grid grid-cols-3 gap-2.5">
      <div class="rounded-2xl p-3 border border-rose-500/30 bg-rose-500/10 ios-glass text-center card-hover">
        <span class="text-[9px] font-bold uppercase text-rose-500 block" data-i18n="labourDue"></span>
        <span id="summaryLabourDue" class="text-base font-black text-rose-500 mt-0.5 block">₹0</span>
      </div>
      <div class="rounded-2xl p-3 border border-amber-500/30 bg-amber-500/10 ios-glass text-center card-hover">
        <span class="text-[9px] font-bold uppercase text-amber-500 block" data-i18n="expenses"></span>
        <span id="summaryExpensesTotal" class="text-base font-black text-amber-500 mt-0.5 block">₹0</span>
      </div>
      <div onclick="navigateTo('viewBills')" class="rounded-2xl p-3 border border-emerald-500/30 bg-emerald-500/10 ios-glass text-center cursor-pointer card-hover">
        <span class="text-[9px] font-bold uppercase text-emerald-500 block" data-i18n="bills"></span>
        <span id="summaryBillsTotal" class="text-base font-black text-emerald-500 mt-0.5 block">₹0</span>
      </div>
    </div>

    <div class="ios-glass rounded-3xl p-4 text-center relative overflow-hidden">
      <h3 class="text-xs font-black" data-i18n="audioSummaryTitle"></h3>
      <p class="text-[10px] opacity-70 mt-0.5" data-i18n="audioSummarySub"></p>
      <button onclick="playVoiceSummary()" class="mt-3 px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-zinc-950 font-black text-xs inline-flex items-center gap-2 active:scale-95 shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <span data-i18n="listenBtn"></span>
      </button>
    </div>

    <!-- VIEW 1: HOME -->
    <section id="viewHome" class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-[11px] font-bold uppercase tracking-wider opacity-70" data-i18n="liveSnapshot"></h2>
        <button onclick="navigateTo('viewLabours')" class="text-[11px] font-bold text-amber-500" data-i18n="viewAllBtn"></button>
      </div>
      <div id="homeRecentLabour" class="space-y-3"></div>
    </section>

    <!-- VIEW 2: LABOURS -->
    <section id="viewLabours" class="space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-black" data-i18n="tabLabour"></h2>
        <div class="flex items-center gap-1.5">
          <button onclick="openHajriBookModal()" class="px-2.5 py-1.5 bg-amber-500/20 border border-amber-500/40 text-amber-500 font-bold text-xs rounded-xl active:scale-95" data-i18n="hajriBookBtn"></button>
          <button onclick="openCarrySelectModal()" class="px-2.5 py-1.5 ios-glass text-amber-500 font-bold text-xs rounded-xl active:scale-95 flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
            <span data-i18n="carryBtn"></span>
          </button>
          <button onclick="openFormModal('labour')" class="px-3 py-1.5 bg-amber-500 text-zinc-950 font-black text-xs rounded-xl shadow active:scale-95" data-i18n="addWorkerBtn"></button>
        </div>
      </div>

      <div class="ios-glass p-2.5 rounded-2xl space-y-2">
        <div class="flex items-center gap-1.5">
          <input type="text" id="labourSearchInput" oninput="renderAll()" data-i18n-placeholder="searchWorkerPh" class="app-input flex-1 rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none" />
          <button type="button" onclick="startVoiceInputForField('labourSearchInput')" class="p-2 bg-amber-500/15 text-amber-500 rounded-xl active:scale-90">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <button type="button" onclick="setLabourCategoryFilter('ALL')" data-cat="ALL" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-black bg-amber-500 text-zinc-950 shrink-0" data-i18n="filterAll"></button>
          <button type="button" onclick="setLabourCategoryFilter('Mason')" data-cat="Mason" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-black/10 dark:bg-white/10 shrink-0" data-i18n="tradeMason"></button>
          <button type="button" onclick="setLabourCategoryFilter('Helper')" data-cat="Helper" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-black/10 dark:bg-white/10 shrink-0" data-i18n="tradeHelper"></button>
          <button type="button" onclick="setLabourCategoryFilter('Plumber')" data-cat="Plumber" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-black/10 dark:bg-white/10 shrink-0" data-i18n="tradePlumber"></button>
          <button type="button" onclick="setLabourCategoryFilter('Carpenter')" data-cat="Carpenter" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-black/10 dark:bg-white/10 shrink-0" data-i18n="tradeCarpenter"></button>
          <button type="button" onclick="setLabourCategoryFilter('Electrician')" data-cat="Electrician" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-black/10 dark:bg-white/10 shrink-0" data-i18n="tradeElectrician"></button>
        </div>
      </div>
      <div id="labourList" class="space-y-3"></div>
    </section>

    <!-- VIEW 3: EXPENSES -->
    <section id="viewExpenses" class="space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-black" data-i18n="tabExpenses"></h2>
        <button onclick="openFormModal('expense')" class="px-3 py-1.5 bg-amber-500 text-zinc-950 font-black text-xs rounded-xl shadow active:scale-95" data-i18n="addExpenseBtn"></button>
      </div>
      <div id="expenseList" class="space-y-3"></div>
    </section>

    <!-- VIEW 4: BILLS -->
    <section id="viewBills" class="space-y-3 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-black" data-i18n="tabBills"></h2>
        <button onclick="openFormModal('bill')" class="px-3 py-1.5 bg-emerald-500 text-zinc-950 font-black text-xs rounded-xl shadow active:scale-95" data-i18n="addBillBtn"></button>
      </div>
      <div id="billList" class="space-y-3"></div>
    </section>
  </main>

  <!-- FLOATING NAV + LOCAL THEKEDAAR AI ORB -->
  <div class="fixed bottom-4 inset-x-0 z-40 flex justify-center items-center gap-2.5 pointer-events-none px-3">
    <nav class="ios-nav pointer-events-auto rounded-full py-1.5 px-2.5 flex items-center justify-around gap-1 flex-1 max-w-[300px]">
      <button onclick="navigateTo('viewHome')" id="nav-viewHome" class="nav-btn active w-11 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.1l9 8.1c.4.3.6.8.6 1.3v8.5c0 1.1-.9 2-2 2h-4.5c-.8 0-1.5-.7-1.5-1.5V15c0-.6-.4-1-1-1s-1 .4-1 1v5.5c0 .8-.7 1.5-1.5 1.5H5.4c-1.1 0-2-.9-2-2v-8.5c0-.5.2-1 .6-1.3l9-8.1z"/></svg></button>
      <button onclick="navigateTo('viewLabours')" id="nav-viewLabours" class="nav-btn w-11 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
      <button onclick="openFormModal('labour')" class="w-10 h-11 flex items-center justify-center active:scale-90"><div class="w-7 h-7 rounded-lg border-2 border-amber-500 flex items-center justify-center text-amber-500 font-black text-lg leading-none">+</div></button>
      <button onclick="navigateTo('viewExpenses')" id="nav-viewExpenses" class="nav-btn w-11 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></button>
      <button onclick="navigateTo('viewBills')" id="nav-viewBills" class="nav-btn w-11 h-11 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></button>
    </nav>
    <button onclick="openThekedaarAIModal()" class="ai-orb pointer-events-auto w-14 h-14 rounded-full flex items-center justify-center text-white active:scale-90 transition-transform shrink-0" title="THEKEDAAR AI">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
    </button>
  </div>

  <!-- MONTH PICKER MODAL -->
  <div id="monthPickerModal" class="fixed inset-0 bg-black/80 backdrop-blur-xl hidden items-center justify-center p-4 z-50">
    <div class="ios-glass rounded-3xl max-w-xs w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-white/10 pb-2">
        <h3 class="font-black text-sm" data-i18n="selectMonthYear"></h3>
        <button onclick="closeModal('monthPickerModal')" class="text-sm font-bold opacity-70">✕</button>
      </div>
      <div class="flex items-center justify-between bg-black/10 dark:bg-white/5 p-2 rounded-2xl">
        <button onclick="changePickerYear(-1)" class="w-9 h-9 rounded-xl ios-glass font-black">‹</button>
        <span id="pickerYearDisplay" class="text-base font-black text-amber-500">2026</span>
        <button onclick="changePickerYear(1)" class="w-9 h-9 rounded-xl ios-glass font-black">›</button>
      </div>
      <div id="pickerMonthsGrid" class="grid grid-cols-3 gap-2"></div>
      <button onclick="selectCurrentMonthNow()" class="w-full py-2.5 rounded-xl bg-amber-500/15 text-amber-500 border border-amber-500/30 text-xs font-black" data-i18n="currentMonthBtn"></button>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="fixed inset-0 bg-black/75 backdrop-blur-md hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="ios-glass rounded-t-3xl sm:rounded-3xl max-w-sm w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 class="font-black text-base" data-i18n="profileAccessTitle"></h3>
        <button onclick="closeModal('profileModal')" class="text-lg font-bold opacity-70">✕</button>
      </div>
      <div class="p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/30">
        <span class="text-[9px] font-bold uppercase text-emerald-500 block" data-i18n="loggedEmailLabel"></span>
        <span id="loggedInEmailDisplay" class="text-xs font-black truncate block mt-0.5"></span>
      </div>
      <div id="masterPasswordSettingBox" class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl space-y-2">
        <label class="text-[10px] font-bold text-amber-500 uppercase block" data-i18n="setMasterPinLabel"></label>

      document.getElementById('lCategory').value = btn.getAttribute('data-trade');
      document.querySelectorAll('.trade-card').forEach(c => c.classList.toggle('active', c === btn));
    };

    function getActiveAcc() {
      const id = localStorage.getItem('thekedaar_active_acc_id') || 'acc_main';
      const acc = state.accounts.find(a => a.id === id) || state.accounts[0];
      return { ...acc, displayNickname: acc.customNickname || (acc.isMaster ? t('mainRole') : t('supRole')) };
    }
    const isMaster = () => getActiveAcc().id === 'acc_main' || getActiveAcc().isMaster;
    const getStamp = () => `${getActiveAcc().displayNickname} • ${new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}`;
    const getStoreKey = () => currentUser ? `thekedaar_v20_${currentUser.uid}` : 'thekedaar_v20_guest';

    function checkOnline() {
      document.getElementById('offlineModal').classList.toggle('hidden', navigator.onLine);
      document.getElementById('offlineModal').classList.toggle('flex', !navigator.onLine);
    }
    window.addEventListener('online', checkOnline); window.addEventListener('offline', checkOnline);

    async function persist() {
      if (!navigator.onLine) return checkOnline();
      state.updatedAt = Date.now();
      localStorage.setItem(getStoreKey(), JSON.stringify(state));
      renderAll();
      if (currentUser) {
        try { await setDoc(doc(db, "users", currentUser.uid), JSON.parse(JSON.stringify(state)), { merge: true }); } catch (e) {}
      }
    }

    window.forceCloudPull = async () => {
      if (!currentUser) return openModal('authModal');
      const snap = await getDoc(doc(db, "users", currentUser.uid));
      if (snap.exists()) { Object.assign(state, snap.data()); localStorage.setItem(getStoreKey(), JSON.stringify(state)); renderAll(); }

      document.getElementById('quickLangBtn').innerText = window.currentLang.toUpperCase();

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = t(el.getAttribute('data-i18n'));
        if (typeof val === 'string') el.innerText = val;
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {

    function renderMonthGrid() {
      document.getElementById('pickerYearDisplay').innerText = pickYear;

    function stopRec() {
      if (activeRecognition) { try { activeRecognition.onresult = activeRecognition.onerror = activeRecognition.onend = null; activeRecognition.stop(); } catch (e) {} activeRecognition = null; }
    }

    function runSpeechCapture(onFinalResult, onStateChange) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("Voice input requires Chrome or Safari."); return; }
      stopRec();
      const rec = new SR();
      rec.lang = speechLocaleMap[window.currentLang] || 'hi-IN';
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      activeRecognition = rec;

      rec.onstart = () => { if (onStateChange) onStateChange('listening'); };
      rec.onresult = (e) => {
        const txt = Array.from(e.results).map(r => r[0].transcript).join('').trim();
        if (onStateChange) onStateChange('transcript', txt);
        if (e.results[e.results.length - 1].isFinal && txt) {
          stopRec();
          if (onStateChange) onStateChange('idle');
          onFinalResult(txt);
        }
      };
      rec.onerror = () => { if (onStateChange) onStateChange('error'); };
      rec.onend = () => { if (activeRecognition === rec) { activeRecognition = null; if (onStateChange) onStateChange('idle'); } };

      try { rec.start(); } catch (err) { if (onStateChange) onStateChange('error'); }
    }

        const pct = Math.min(100, Math.round((eff / 30) * 100));
        return `
          <div class="ios-glass p-4 rounded-3xl space-y-2.5 card-hover">
            <div class="flex justify-between items-start">
              <div>
                <button onclick="openHist('${l.id}')" class="font-black text-sm underline decoration-amber-500/50">${l.name}</button>
                <div class="text-[10px] opacity-75 mt-0.5">${l.category} ${l.phone ? `• <a href="tel:${l.phone}" class="text-emerald-400 font-bold">${l.phone}</a>` : ''}</div>
                <div class="text-[11px] mt-1 flex items-center gap-1.5 flex-wrap">
                  <span>${t('rateLbl')}: <b>${fmtINR(l.dailyRate)}</b></span>
                  ${master ? `<button onclick="editRate('${l.id}')" class="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-500 font-bold">${t('editLbl')}</button>` : ''}
                  <span>| ${t('advLbl')}: <b class="text-rose-500">${fmtINR(l.advance)}</b></span>
                  <button onclick="openAdv('${l.id}')" class="text-[9px] px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-500 font-bold">+ ${t('advLbl')}</button>
                </div>
              </div>
              <div class="text-right">
                <span class="text-[9px] uppercase opacity-65 block">${t('netDueLbl')}</span>
                <span class="text-base font-black ${net>=0?'text-emerald-500':'text-rose-500'}">${fmtINR(net)}</span>
                ${master ? `<button onclick="deleteRecord('labours','${l.id}')" class="block ml-auto text-[10px] text-rose-500 font-bold mt-1">${t('deleteBtn')}</button>` : ''}
              </div>
            </div>
            <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-500 to-emerald-500 transition-all" style="width:${pct}%"></div></div>
            <div class="bg-black/15 p-2 rounded-2xl flex items-center justify-between text-xs">
              <span onclick="openHist('${l.id}')" class="cursor-pointer">${t('presentLbl')}: <b class="text-emerald-500">${l.presentDays}P</b> | ${t('halfLbl')}: <b class="text-amber-500">${l.halfDays}H</b></span>
              <div class="flex gap-1">
                <button onclick="updateAtt('${l.id}','-P')" class="w-7 h-7 rounded-lg bg-white/10 font-black">-P</button>
                <button onclick="updateAtt('${l.id}','+P')" class="w-7 h-7 rounded-lg bg-emerald-500 text-zinc-950 font-black">+P</button>
                <button onclick="updateAtt('${l.id}','+H')" class="px-2 h-7 rounded-lg bg-amber-500 text-zinc-950 font-black">+H</button>
              </div>
            </div>
            <div class="flex items-center justify-between text-[10px]">
              <span class="opacity-55 truncate">${l.lastUpdatedBy || ''}</span>
              <div class="flex gap-1.5">
                ${master && net > 0 ? `<button onclick="settlePay('${l.id}')" class="px-2.5 py-1 rounded-xl bg-amber-500/15 text-amber-500 font-black">${t('settleLbl')}</button>` : ''}
                <button onclick="waSlip('${l.id}')" class="px-2.5 py-1 rounded-xl bg-emerald-500/15 text-emerald-500 font-bold">${t('slipLbl')}</button>
              </div>
            </div>
          </div>`;
      }).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noWorkers')}</div>`;

      document.getElementById('homeRecentLabour').innerHTML = allW.length ? allW.slice(0,4).map(l => {
        const net = Math.round(l.dailyRate * (l.presentDays + l.halfDays * 0.5)) - l.advance;
        return `<div onclick="openHist('${l.id}')" class="ios-glass p-3.5 rounded-2xl flex justify-between items-center text-xs card-hover cursor-pointer"><div><b>${l.name}</b><div class="text-[10px] opacity-70">${l.category} • ${l.presentDays}P, ${l.halfDays}H</div></div><b class="text-sm ${net>=0?'text-emerald-500':'text-rose-500'}">${fmtINR(net)}</b></div>`;
      }).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noWorkers')}</div>`;

      const ex = state.expenses.filter(e => e.site === site && e.month === m);
      document.getElementById('summaryExpensesTotal').innerText = fmtINR(ex.reduce((a, b) => a + b.amount, 0));
      document.getElementById('expenseList').innerHTML = ex.length ? ex.map(e => `<div class="ios-glass p-3.5 rounded-2xl flex justify-between items-center text-xs"><div><b>${e.title}</b><div class="text-[10px] opacity-65">${e.spentFor || ''} ${e.addedBy || ''}</div></div><div class="text-right"><b class="text-amber-500 block">${fmtINR(e.amount)}</b>${master ? `<button onclick="deleteRecord('expenses','${e.id}')" class="text-[10px] text-rose-500 font-bold">${t('deleteBtn')}</button>` : ''}</div></div>`).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noExpenses')}</div>`;

      const bs = state.bills.filter(b => b.site === site && b.month === m);
      document.getElementById('summaryBillsTotal').innerText = fmtINR(bs.reduce((a, b) => a + b.amount, 0));
      document.getElementById('billList').innerHTML = bs.length ? bs.map(b => `<div class="ios-glass p-3.5 rounded-2xl flex justify-between items-center text-xs"><div><b>${b.title}</b><div class="text-[10px] opacity-65">${b.billDate}</div></div><div class="text-right"><b class="text-emerald-500 block">${fmtINR(b.amount)}</b>${master ? `<button onclick="deleteRecord('bills','${b.id}')" class="text-[10px] text-rose-500 font-bold">${t('deleteBtn')}</button>` : ''}</div></div>`).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noBills')}</div>`;
    };

    window.connectCloud = async (reg) => {
      const e = document.getElementById('authEmail').value.trim(), p = document.getElementById('authPass').value.trim();
      try { if (reg) await createUserWithEmailAndPassword(auth, e, p); else await signInWithEmailAndPassword(auth, e, p); closeModal('authModal'); } catch (err) { alert(err.message); }
    };
    window.logoutAccount = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, (user) => {
      if (unsubSnap) { unsubSnap(); unsubSnap = null; }
      currentUser = user;
      const saved = localStorage.getItem(getStoreKey());
      if (saved) Object.assign(state, JSON.parse(saved));
      if (user) {
        unsubSnap = onSnapshot(doc(db, "users", user.uid), (snap) => {
          if (snap.exists()) { Object.assign(state, snap.data()); localStorage.setItem(getStoreKey(), JSON.stringify(state)); renderAll(); }
          else persist();
        });
      }
      renderAll();
    });

    checkOnline();
    changeLanguage(window.currentLang);
  </script>
</body>
</html>
