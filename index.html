    function stopRec() {
      if (activeRecognition) {
        try { activeRecognition.onresult = activeRecognition.onerror = activeRecognition.onend = null; activeRecognition.stop(); } catch (e) {}
        activeRecognition = null;
      }
    }

    function runSpeechCapture(onFinalResult, onStateChange) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("Voice input requires Chrome or Safari."); return; }
      stopRec();
      const rec = new SR();
      rec.lang = speechLocaleMap[window.currentLang] || 'hi-IN';
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      activeRecognition = rec;

      rec.onstart = () => { if (onStateChange) onStateChange('listening'); };
      rec.onresult = (e) => {
        if (!e || !e.results || !e.results.length) return;
        const txt = Array.from(e.results).map(r => (r[0] && r[0].transcript) || '').join('').trim();
        if (onStateChange) onStateChange('transcript', txt);
        if (e.results[e.results.length - 1].isFinal && txt) {
          stopRec();
          if (onStateChange) onStateChange('idle');
          if (typeof onFinalResult === 'function') onFinalResult(txt);
        }
      };
      rec.onerror = () => { if (onStateChange) onStateChange('error'); };
      rec.onend = () => { if (activeRecognition === rec) { activeRecognition = null; if (onStateChange) onStateChange('idle'); } };

      try { rec.start(); } catch (err) { if (onStateChange) onStateChange('error'); }
    }

      const site = byId('siteSelect')?.value, curM = byId('monthSelect')?.value || '2026-11';
      let [y, m] = curM.split('-').map(Number); m--; if (m < 1) { m = 12; y--; }
      const prevM = `${y}-${String(m).padStart(2,'0')}`;
      const curNames = new Set(state.labours.filter(l => l.site === site && l.month === curM).map(l => l.name.toLowerCase()));
      const cands = state.labours.filter(l => l.site === site && l.month === prevM && !curNames.has(l.name.toLowerCase()));
      window._carry = cands;
      if (byId('carryWorkersList')) {
        byId('carryWorkersList').innerHTML = cands.length ? cands.map((w, i) => `<label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/5 text-xs"><input type="checkbox" value="${i}" class="carry-cb accent-amber-500" checked/><b>${w.name}</b> (${fmtINR(w.dailyRate)})</label>`).join('') : `<div class="text-center py-6 text-xs opacity-60">${t('noWorkers')}</div>`;
      }
      openModal('carryModal');
    };
    window.executeCarryForwardSelected = () => {
      const site = byId('siteSelect')?.value, curM = byId('monthSelect')?.value || '2026-11';
      document.querySelectorAll('.carry-cb:checked').forEach(cb => {
        const w = (window._carry || [])[cb.value];
        if (w) state.labours.unshift({ ...w, id: Date.now().toString() + Math.random().toString().slice(2,5), month: curM, advance: 0, advanceLog: [], presentDays: 0, halfDays: 0, lastUpdatedBy: getStamp() });
      });
      closeModal('carryModal'); persist();
    };

    window.openHajriBookModal = () => { renderDailyHajriSheet(); openModal('hajriBookModal'); };
    window.shiftHajriDate = (d) => { const i = byId('hajriDateInput'); if (!i) return; const dt = new Date(i.value || isoToday); dt.setDate(dt.getDate()+d); i.value = dt.toISOString().split('T')[0]; renderDailyHajriSheet(); };
    window.renderDailyHajriSheet = () => {
      const dt = byId('hajriDateInput')?.value || isoToday, site = byId('siteSelect')?.value, m = dt.slice(0,7);
      const ws = state.labours.filter(l => l.site === site && l.month === m);
      const rec = (state.dailyHajriRecords[dt] = state.dailyHajriRecords[dt] || {});
      if (byId('hajriWorkersContainer')) {
        byId('hajriWorkersContainer').innerHTML = ws.map(w => `
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-white/5 text-xs">
            <b>${w.name}</b>
            <div class="flex gap-1">
              ${['P','H','A'].map(s => `<button type="button" onclick="setHajri('${dt}','${w.id}','${s}')" class="w-8 h-8 rounded-lg font-black ${rec[w.id]===s ? (s==='P'?'bg-emerald-500 text-black':s==='H'?'bg-amber-500 text-black':'bg-rose-500 text-white') : 'bg-white/10'}">${s}</button>`).join('')}
            </div>
          </div>`).join('');
      }
    };
    window.setHajri = (dt, id, s) => {
      (state.dailyHajriRecords[dt] = state.dailyHajriRecords[dt] || {})[id] = s;
      const m = dt.slice(0,7), w = state.labours.find(x => x.id === id);
      if (w) {
        let p = 0, h = 0;
        Object.keys(state.dailyHajriRecords).forEach(k => { if (k.startsWith(m)) { if (state.dailyHajriRecords[k][id]==='P') p++; if (state.dailyHajriRecords[k][id]==='H') h++; } });
        w.presentDays = p; w.halfDays = h; w.lastUpdatedBy = getStamp();
      }
      persist(); renderDailyHajriSheet();
    };
    window.markAllWorkersToday = (s) => {
      const dt = byId('hajriDateInput')?.value || isoToday, site = byId('siteSelect')?.value;
      state.labours.filter(l => l.site === site && l.month === dt.slice(0,7)).forEach(w => setHajri(dt, w.id, s));
    };
    window.openHist = (id) => {
      const l = state.labours.find(x => x.id === id); if (!l) return;
      if (byId('labourHistoryTitle')) byId('labourHistoryTitle').innerText = l.name;
      const rows = Object.keys(state.dailyHajriRecords).sort().filter(k => k.startsWith(l.month) && state.dailyHajriRecords[k][id]).map(k => `<div class="flex justify-between p-2 rounded-xl bg-white/5"><span>${k}</span><b>${state.dailyHajriRecords[k][id]}</b></div>`).join('');
      if (byId('labourHistoryContent')) byId('labourHistoryContent').innerHTML = rows || `<div class="text-center py-4 opacity-60">${l.presentDays}P / ${l.halfDays}H</div>`;
      openModal('labourHistoryModal');
    };

    window.openMonthlyLedgerModal = () => {
      const site = byId('siteSelect')?.value, m = byId('monthSelect')?.value || '2026-11';
      const ws = state.labours.filter(l => l.site === site && l.month === m);
      const ex = state.expenses.filter(e => e.site === site && e.month === m);
      const bs = state.bills.filter(b => b.site === site && b.month === m);
      const wages = ws.reduce((a, w) => a + Math.round(w.dailyRate * (w.presentDays + w.halfDays * 0.5)), 0);
      const expT = ex.reduce((a, e) => a + e.amount, 0), billT = bs.reduce((a, b) => a + b.amount, 0);
      const profit = billT - (wages + expT);
      if (byId('monthlyLedgerModalBody')) {
        byId('monthlyLedgerModalBody').innerHTML = `
          <div class="p-3.5 rounded-2xl ${profit>=0?'bg-emerald-500/15 border-emerald-500/30':'bg-rose-500/15 border-rose-500/30'} border flex justify-between items-center text-xs">
            <span class="font-bold">${t('profitLbl')}</span><b class="text-base">${fmtINR(profit)}</b>
          </div>
          ${bs.map(b => `<div class="p-3 rounded-2xl bg-white/5 text-xs space-y-2"><div class="flex justify-between"><b>${b.title}</b><b class="text-emerald-500">${fmtINR(b.amount)}</b></div>${b.attachment?.dataUrl?.startsWith('data:image') ? `<img src="${b.attachment.dataUrl}" class="w-full max-h-40 object-cover rounded-xl"/>` : ''}</div>`).join('')}`;
      }
      openModal('monthlyLedgerModal');
    };

    window.playVoiceSummary = () => {
      const lang = window.currentLang || 'hi';
      const s = byId('siteSelect')?.value || state.sites[0] || '';
      const m = byId('monthSelect')?.value || '2026-11';
      const ws = (state.labours || []).filter(l => l.site === s && l.month === m);
      const wages = ws.reduce((a, w) => a + Math.round((w.dailyRate||0) * ((w.presentDays||0) + (w.halfDays||0) * 0.5)), 0);
      const expNum = (state.expenses || []).filter(e => e.site === s && e.month === m).reduce((a, b) => a + (b.amount||0), 0);
      const billNum = (state.bills || []).filter(b => b.site === s && b.month === m).reduce((a, b) => a + (b.amount||0), 0);
      const due = byId('summaryLabourDue')?.innerText || '₹0';
      const exp = byId('summaryExpensesTotal')?.innerText || '₹0';
      const bill = byId('summaryBillsTotal')?.innerText || '₹0';
      const profit = fmtINR(billNum - (wages + expNum));
      const tpl = summaryTemplates[lang] || summaryTemplates.hi;
      const msg = tpl({ s, mName: fmtMonth(m), count: ws.length, due, exp, bill, profit });

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(msg);
          const targetLocale = speechLocaleMap[lang] || 'hi-IN';
          u.lang = targetLocale;
          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const baseCode = targetLocale.split('-')[0].toLowerCase();
          const matched = voices.find(v => (v.lang || '').toLowerCase() === targetLocale.toLowerCase())
            || voices.find(v => (v.lang || '').toLowerCase().startsWith(baseCode))
            || voices.find(v => (v.lang || '').toLowerCase().startsWith('hi'))
            || voices.find(v => (v.lang || '').toLowerCase().startsWith('en'));
          if (matched) {
            u.voice = matched;
            u.lang = matched.lang;
          }
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    };

    window.renderAll = () => {
      const sel = byId('siteSelect');
      if (!sel) return;
      if (!Array.isArray(state.sites) || !state.sites.length) state.sites = ['Site A'];
      const curS = sel.value && state.sites.includes(sel.value) ? sel.value : state.sites[0];
      sel.innerHTML = state.sites.map(s => `<option value="${s}" ${s===curS?'selected':''}>${s}</option>`).join('');
      const site = sel.value, m = byId('monthSelect')?.value || '2026-11', master = isMaster();
      if (byId('monthDisplayLabel')) byId('monthDisplayLabel').innerText = fmtMonth(m);
      if (byId('activeNicknameBadge')) byId('activeNicknameBadge').innerText = getActiveAcc().displayNickname;
      if (byId('deleteSiteBtn')) byId('deleteSiteBtn').classList.toggle('hidden', !master);
      if (byId('loggedInEmailDisplay')) byId('loggedInEmailDisplay').innerText = currentUser?.email || t('notLoggedLbl');
      if (byId('profileLogoutBtn')) byId('profileLogoutBtn').classList.toggle('hidden', !currentUser);
      if (byId('syncStatus')) byId('syncStatus').innerText = currentUser ? `${t('cloudLbl')} (${currentUser.email.split('@')[0]})` : t('onlineLbl');

      const allW = (state.labours || []).filter(l => l.site === site && l.month === m);
      const q = (byId('labourSearchInput')?.value || '').trim().toLowerCase();
      const visW = allW.filter(l => (!q || (l.name||'').toLowerCase().includes(q) || (l.phone||'').includes(q)) && (activeCategoryFilter === 'ALL' || (l.category||'').toLowerCase().includes(activeCategoryFilter.toLowerCase())));

      let dueT = 0;
      allW.forEach(w => { dueT += Math.round((w.dailyRate||0) * ((w.presentDays||0) + (w.halfDays||0) * 0.5)) - (w.advance||0); });
      if (byId('summaryLabourDue')) byId('summaryLabourDue').innerText = fmtINR(dueT);

      if (byId('labourList')) {
        byId('labourList').innerHTML = visW.length ? visW.map(l => {
          const eff = (l.presentDays||0) + (l.halfDays||0) * 0.5, net = Math.round((l.dailyRate||0) * eff) - (l.advance||0);
          const pct = Math.min(100, Math.round((eff / 30) * 100));
          return `
            <div class="ios-glass p-4 rounded-3xl space-y-2.5 card-hover">
              <div class="flex justify-between items-start">
                <div>
                  <button type="button" onclick="openHist('${l.id}')" class="font-black text-sm underline decoration-amber-500/50">${l.name}</button>
                  <div class="text-[10px] opacity-75 mt-0.5">${l.category} ${l.phone ? `• <a href="tel:${l.phone}" class="text-emerald-400 font-bold">${l.phone}</a>` : ''}</div>
                  <div class="text-[11px] mt-1 flex items-center gap-1.5 flex-wrap">
                    <span>${t('rateLbl')}: <b>${fmtINR(l.dailyRate)}</b></span>
                    ${master ? `<button type="button" onclick="editRate('${l.id}')" class="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-500 font-bold">${t('editLbl')}</button>` : ''}
                    <span>| ${t('advLbl')}: <b class="text-rose-500">${fmtINR(l.advance)}</b></span>
                    <button type="button" onclick="openAdv('${l.id}')" class="text-[9px] px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-500 font-bold">+ ${t('advLbl')}</button>
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-[9px] uppercase opacity-65 block">${t('netDueLbl')}</span>
                  <span class="text-base font-black ${net>=0?'text-emerald-500':'text-rose-500'}">${fmtINR(net)}</span>
                  ${master ? `<button type="button" onclick="deleteRecord('labours','${l.id}')" class="block ml-auto text-[10px] text-rose-500 font-bold mt-1">${t('deleteBtn')}</button>` : ''}
                </div>
              </div>
              <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-500 to-emerald-500 transition-all" style="width:${pct}%"></div></div>
              <div class="bg-black/15 p-2 rounded-2xl flex items-center justify-between text-xs">
                <span onclick="openHist('${l.id}')" class="cursor-pointer">${t('presentLbl')}: <b class="text-emerald-500">${l.presentDays||0}P</b> | ${t('halfLbl')}: <b class="text-amber-500">${l.halfDays||0}H</b></span>
                <div class="flex gap-1">
                  <button type="button" onclick="updateAtt('${l.id}','-P')" class="w-7 h-7 rounded-lg bg-white/10 font-black">-P</button>
                  <button type="button" onclick="updateAtt('${l.id}','+P')" class="w-7 h-7 rounded-lg bg-emerald-500 text-zinc-950 font-black">+P</button>
                  <button type="button" onclick="updateAtt('${l.id}','+H')" class="px-2 h-7 rounded-lg bg-amber-500 text-zinc-950 font-black">+H</button>
                </div>
              </div>
              <div class="flex items-center justify-between text-[10px]">
                <span class="opacity-55 truncate">${l.lastUpdatedBy || ''}</span>
                <div class="flex gap-1.5">
                  ${master && net > 0 ? `<button type="button" onclick="settlePay('${l.id}')" class="px-2.5 py-1 rounded-xl bg-amber-500/15 text-amber-500 font-black">${t('settleLbl')}</button>` : ''}
                  <button type="button" onclick="waSlip('${l.id}')" class="px-2.5 py-1 rounded-xl bg-emerald-500/15 text-emerald-500 font-bold">${t('slipLbl')}</button>
                </div>
              </div>
            </div>`;
        }).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noWorkers')}</div>`;
      }

      if (byId('homeRecentLabour')) {
        byId('homeRecentLabour').innerHTML = allW.length ? allW.slice(0,4).map(l => {
          const net = Math.round((l.dailyRate||0) * ((l.presentDays||0) + (l.halfDays||0) * 0.5)) - (l.advance||0);
          return `<div onclick="openHist('${l.id}')" class="ios-glass p-3.5 rounded-2xl flex justify-between items-center text-xs card-hover cursor-pointer"><div><b>${l.name}</b><div class="text-[10px] opacity-70">${l.category} • ${l.presentDays||0}P, ${l.halfDays||0}H</div></div><b class="text-sm ${net>=0?'text-emerald-500':'text-rose-500'}">${fmtINR(net)}</b></div>`;
        }).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noWorkers')}</div>`;
      }

      const ex = (state.expenses || []).filter(e => e.site === site && e.month === m);
      if (byId('summaryExpensesTotal')) byId('summaryExpensesTotal').innerText = fmtINR(ex.reduce((a, b) => a + (b.amount||0), 0));
      if (byId('expenseList')) {
        byId('expenseList').innerHTML = ex.length ? ex.map(e => `<div class="ios-glass p-3.5 rounded-2xl flex justify-between items-center text-xs"><div><b>${e.title}</b><div class="text-[10px] opacity-65">${e.spentFor || ''} ${e.addedBy || ''}</div></div><div class="text-right"><b class="text-amber-500 block">${fmtINR(e.amount)}</b>${master ? `<button type="button" onclick="deleteRecord('expenses','${e.id}')" class="text-[10px] text-rose-500 font-bold">${t('deleteBtn')}</button>` : ''}</div></div>`).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noExpenses')}</div>`;
      }

      const bs = (state.bills || []).filter(b => b.site === site && b.month === m);
      if (byId('summaryBillsTotal')) byId('summaryBillsTotal').innerText = fmtINR(bs.reduce((a, b) => a + (b.amount||0), 0));
      if (byId('billList')) {
        byId('billList').innerHTML = bs.length ? bs.map(b => `<div class="ios-glass p-3.5 rounded-2xl flex justify-between items-center text-xs"><div><b>${b.title}</b><div class="text-[10px] opacity-65">${b.billDate || ''}</div></div><div class="text-right"><b class="text-emerald-500 block">${fmtINR(b.amount)}</b>${master ? `<button type="button" onclick="deleteRecord('bills','${b.id}')" class="text-[10px] text-rose-500 font-bold">${t('deleteBtn')}</button>` : ''}</div></div>`).join('') : `<div class="ios-glass rounded-2xl p-6 text-center text-xs opacity-60">${t('noBills')}</div>`;
      }
    };

    window.connectCloud = async (reg) => {
      const e = (byId('authEmail')?.value || '').trim(), p = (byId('authPass')?.value || '').trim();
      try { if (reg) await createUserWithEmailAndPassword(auth, e, p); else await signInWithEmailAndPassword(auth, e, p); closeModal('authModal'); } catch (err) { alert(err.message); }
    };

    window.logoutAccount = async () => {
      if (unsubSnap) { unsubSnap(); unsubSnap = null; }
      currentUser = null;
      applyFreshState(null);
      clearUserLocalCaches();
      closeModal('profileModal');
      renderAll();
      try { await signOut(auth); } catch (e) {}
    };

    onAuthStateChanged(auth, (user) => {
      if (unsubSnap) { unsubSnap(); unsubSnap = null; }
      currentUser = user;
      applyFreshState(null);
      if (user) {
        const key = getStoreKey();
        try {
          const saved = localStorage.getItem(key);
          if (saved) applyFreshState(JSON.parse(saved));
        } catch (e) {}
        unsubSnap = onSnapshot(doc(db, "users", user.uid), (snap) => {
          if (snap.exists()) {
            applyFreshState(snap.data());
            try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
            renderAll();
          } else {
            persist();
          }
        }, () => {});
      } else {
        clearUserLocalCaches();
      }
      renderAll();
    });

    checkOnline();
    changeLanguage(window.currentLang);
  </script>
</body>
</html>
